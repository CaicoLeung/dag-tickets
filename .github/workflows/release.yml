name: release

# Tag-driven: pushing `v<x.y.z>` builds the 4 prebuilt binaries, publishes a
# GitHub Release with tarballs + SHA256SUMS, attests build provenance, and
# regenerates the Homebrew formula in CaicoLeung/homebrew-tap.
# The `release` environment holds an approval gate (Settings -> Environments).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write      # create the GitHub Release
  id-token: write      # OIDC for build-provenance attestation
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Resolve version + assert tag matches package.json
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PKG_VER=$(grep -m1 '"version"' package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          [ "$VERSION" = "$PKG_VER" ] || { echo "tag '$VERSION' != package.json '$PKG_VER'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install deps + verify
        run: |
          bun install
          bun run typecheck
          bun test

      - name: Build + package 4 targets
        run: |
          mkdir -p dist
          for target in bun-darwin-arm64 bun-darwin-x64 bun-linux-x64 bun-linux-arm64; do
            echo "::group::build $target"
            bun build bin/dag-tickets.ts --compile --target="$target" --outfile "dist/dag-tickets"
            tuple="${target#bun-}"          # darwin-arm64, darwin-x64, ...
            tar -C dist -czf "dist/dag-tickets-${tuple}.tar.gz" dag-tickets
            rm -f "dist/dag-tickets"
            echo "::endgroup::"
          done

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum dag-tickets-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/dag-tickets-*.tar.gz
            dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/dag-tickets-*.tar.gz

      - name: Regenerate Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          DARWIN_ARM64=$(awk -v t="dag-tickets-darwin-arm64.tar.gz" '$2==t {print $1}' dist/SHA256SUMS)
          DARWIN_X64=$(awk -v t="dag-tickets-darwin-x64.tar.gz"   '$2==t {print $1}' dist/SHA256SUMS)
          [ -n "$DARWIN_ARM64" ] && [ -n "$DARWIN_X64" ] || { echo "missing darwin checksums"; exit 1; }

          git clone "https://x-access-token:${GH_TOKEN}@github.com/CaicoLeung/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cat > /tmp/tap/Formula/dag-tickets.rb <<EOF
          # Generated by dag-tickets release workflow — do not edit by hand.
          class DagTickets < Formula
            desc "DAG-aware batch driver for GitHub-issue to PR pipelines"
            homepage "https://github.com/CaicoLeung/dag-tickets"
            license "MIT"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "https://github.com/CaicoLeung/dag-tickets/releases/download/${TAG}/dag-tickets-darwin-arm64.tar.gz"
                sha256 "${DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/CaicoLeung/dag-tickets/releases/download/${TAG}/dag-tickets-darwin-x64.tar.gz"
                sha256 "${DARWIN_X64}"
              end
            end

            def install
              bin.install "dag-tickets"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/dag-tickets --version")
            end
          end
          EOF

          cd /tmp/tap
          git add Formula/dag-tickets.rb
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "brew: dag-tickets ${VERSION}" || true
          git push origin HEAD:main
